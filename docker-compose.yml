name: beo-trade

# One autonomous process owns scan, monitor, reconciliation, and the schedule.
# A second process cannot trade: it exits on the data-volume lock.
# Redis is not required. The runtime database is SQLite on beo_data.
# APP_ENV stays local because the application refuses SQLite when APP_ENV=production.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-paper: &paper-env
  APP_ENV: local
  TRADING_MODE: PAPER
  PAPER_ONLY: "true"
  AUTO_CREATE_TABLES: "true"
  TZ: UTC

services:
  migrate:
    image: beo-trade-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.ops.migrate"]
    env_file:
      - .env
    environment:
      <<: *paper-env
      THETADATA_BASE_URL: ${THETADATA_BASE_URL:-http://theta:25503}
    volumes:
      - beo_data:/app/data
    networks:
      - beo
    restart: "no"
    logging: *default-logging

  api:
    image: beo-trade-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      <<: *paper-env
      THETADATA_BASE_URL: ${THETADATA_BASE_URL:-http://theta:25503}
      # Status and the kill flag live on the Avi volume. This does not point at beo_trade.db.
      AVI_ENGINE_ENABLED: ${AVI_ENGINE_ENABLED:-false}
      AVI_DB_PATH: /app/avi/avi.sqlite
    volumes:
      - beo_data:/app/data
      - avi_data:/app/avi
    expose:
      - "8000"
    networks:
      - beo
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

  worker:
    image: beo-trade-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.workers.runner"]
    env_file:
      - .env
    environment:
      <<: *paper-env
      # Image already sets this. Repeat it so a compose env override cannot buffer the submit log.
      PYTHONUNBUFFERED: "1"
      THETADATA_BASE_URL: ${THETADATA_BASE_URL:-http://theta:25503}
    volumes:
      - beo_data:/app/data
    networks:
      - beo
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    # deploy.resources is ignored by some `docker compose up` hosts (including older XCloud).
    # mem_limit is the key that plain Compose applies. memswap_limit matches it so swap cannot grow past 1536M.
    mem_limit: 1536m
    memswap_limit: 1536m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    # Liveness only. worker_heartbeat.txt is rewritten every loop, including a failed Alpaca read.
    # Cycle success is monitor_cycle.json last_success, which this check does not read.
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/app/data/worker_heartbeat.txt'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<180 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  spy:
    image: beo-trade-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.spy.runner"]
    env_file:
      - .env
    environment:
      <<: *paper-env
      PYTHONUNBUFFERED: "1"
      SPY_ENGINE_ENABLED: ${SPY_ENGINE_ENABLED:-false}
      SPY_ALPACA_KEY_ID: ${SPY_ALPACA_KEY_ID:-}
      SPY_ALPACA_SECRET_KEY: ${SPY_ALPACA_SECRET_KEY:-}
      SPY_ALPACA_ACCOUNT: ${SPY_ALPACA_ACCOUNT:-}
      SPY_ALPACA_BASE_URL: ${SPY_ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      SPY_DATA_URL: ${SPY_DATA_URL:-https://data.alpaca.markets}
      SPY_PDT_GUARD: ${SPY_PDT_GUARD:-true}
      SPY_ALLOW_SHORT: ${SPY_ALLOW_SHORT:-false}
      SPY_TRADE_SYMBOLS: ${SPY_TRADE_SYMBOLS:-SPY,QQQ,IWM}
      SPY_MAX_POSITIONS: ${SPY_MAX_POSITIONS:-3}
      SPY_MAX_ENTRIES_DAY: ${SPY_MAX_ENTRIES_DAY:-6}
      SPY_SHADOW_SYMBOLS: ${SPY_SHADOW_SYMBOLS:-}
    volumes:
      - beo_data:/app/data
    networks:
      - beo
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/app/data/spy_heartbeat.txt'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<180 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

  avi:
    image: beo-trade-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "app.avi.runner"]
    env_file:
      - .env
    environment:
      <<: *paper-env
      PYTHONUNBUFFERED: "1"
      AVI_ENGINE_ENABLED: ${AVI_ENGINE_ENABLED:-false}
      AVI_ALPACA_API_KEY: ${AVI_ALPACA_API_KEY:-}
      AVI_ALPACA_SECRET_KEY: ${AVI_ALPACA_SECRET_KEY:-}
      AVI_ACCOUNT_LAST4: ${AVI_ACCOUNT_LAST4:-}
      AVI_ALPACA_BASE_URL: ${AVI_ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      AVI_DATA_URL: ${AVI_DATA_URL:-https://data.alpaca.markets}
      AVI_RISK_PCT: ${AVI_RISK_PCT:-0.04}
      AVI_BANKROLL: ${AVI_BANKROLL:-}
      AVI_MAX_CONTRACTS: ${AVI_MAX_CONTRACTS:-10}
      AVI_MAX_DEBIT_PCT: ${AVI_MAX_DEBIT_PCT:-0.08}
      AVI_KILL_SWITCH: ${AVI_KILL_SWITCH:-false}
      AVI_KILL_FLAG: ${AVI_KILL_FLAG:-}
      AVI_DB_PATH: /app/data/avi.sqlite
    volumes:
      - avi_data:/app/data
    networks:
      - beo
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    memswap_limit: 512m
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import time; from pathlib import Path; p=Path('/app/data/avi_heartbeat.txt'); raise SystemExit(0 if p.exists() and time.time()-p.stat().st_mtime<180 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

  theta:
    image: beo-trade-theta
    build:
      context: ./docker/theta
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      TZ: UTC
      THETA_LAUNCHER: v3-session
      # Bump this nonce to force a theta recreate on deploy. start.sh ignores it.
      THETA_RECREATE_NONCE: "2026-10-28-1"
    expose:
      - "25503"
    volumes:
      - theta_logs:/opt/theta/logs
      - theta_lib:/opt/theta/lib
    networks:
      - beo
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:25503/v3/terminal/mdds/status"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 240s

  web:
    image: beo-trade-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Only the login and the internal API key reach the web container, not the broker or data secrets.
      API_ADMIN_KEY: ${API_ADMIN_KEY:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - beo
    depends_on:
      api:
        condition: service_healthy
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

networks:
  beo:
    name: beo_trade

volumes:
  beo_data:
  avi_data:
  theta_logs:
  theta_lib:
