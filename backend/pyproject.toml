[project]
name = "beo-trade"
version = "1.0.0"
description = "Intraday options analysis and paper-trading recommendations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "httpx>=0.27,<0.28",
  "psycopg[binary]>=3.2",
  "PyJWT>=2.10.0",
  "structlog>=25.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["config/*.toml", "config/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
